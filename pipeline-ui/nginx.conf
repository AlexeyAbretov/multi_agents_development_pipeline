server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: re-resolve orchestrator after recreate (otherwise stale IP → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $orchestrator http://orchestrator:3020;
        proxy_pass $orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        set $orchestrator_health http://orchestrator:3020/health;
        proxy_pass $orchestrator_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
